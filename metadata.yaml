name: astrbot_plugin_ctm
display_name: 对话认知中枢 · 长期记忆
short_desc: 跨会话长期记忆 + 话题软边界 + 关系状态，每轮只注入一次、有预算上限
desc: |-
  对话认知中枢（Cognitive Turn Manager，CTM）不是又一个记忆插件，而是把
  「话题路由 + 长期记忆 + 人格/关系状态」收敛成一个决策点：

  - 四种运行模式：off / mark / hint / auto；auto 置信度达标时自动新建对话（等价 /new）；
  - 内建消息聚合：连发消息先合并成一轮，再判定、只回一次；
  - 话题判定两层：启发式优先，拿不准时问一次便宜模型，失败一律按延续；
  - 每轮只做一次 `TurnDecision`，只在一个位置注入（`on_llm_request`）；
  - 软话题边界只压栈不清空，回溯旧话题时弹栈自然衔接；
  - 断言 / 情节 / 话题摘要按预算装箱后注入，注入量有上限、有记录；
  - 归档异步执行，失败重试并落 `archive_failures`，不阻塞下一轮；
  - 默认 SQLite 自包含，插件详情页提供只读运行状态面板。

  当前为 v0.4.2：消息聚合、双层话题判定、长期记忆、话题软边界与关系状态均已可运行；
  v0.4.1 修复了 v0.4.0 在真机上"加载成功但一条消息都不处理"的 handler 绑定问题；
  v0.4.2 增加自检（`/ctm doctor` + 状态页红条）：白名单 / handler 绑定 / 入口心跳 / DB 一屏看清；
  常见坑与解决办法见仓库 docs/TROUBLESHOOTING.md。
  记忆按用户/群聊隔离，默认 SQLite 自包含，零第三方依赖。
version: v0.4.2
author: xun-hen
repo: https://github.com/xun-hen/astrbot_plugin_ctm
astrbot_version: ">=4.26"
tags:
  - 记忆
  - 话题
  - 人格
  - 上下文
  - 陪伴
  - memory
  - context
help: |-
  CTM 默认无需指令即可工作。

  调试与运维：
  /ctm status          当前会话话题栈、关系状态、预算、长期记忆统计
  /ctm topics          最近话题
  /ctm topic new|forget|off|on  话题操作
  /ctm memory list     短期记忆列表
  /ctm longterm list   长期记忆列表
  /ctm longterm delete <id前缀>  删除长期记忆
  /ctm health          适配器 / DB / 队列健康检查
  /ctm doctor          自检：白名单 / handler 绑定 / 入口心跳 / DB / 版本
                       装完先跑这条，六项全 OK 才算生效
  /ctm status          含聚合与判定状态
  /ctm export          导出本会话数据
tags_tip: 默认配置即可用；建议先以 auto_switch_strategy=soft 观察一周再调阈值。
